name: new_power
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.10.7

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: 9.1.1
  get_it: 9.0.5
  dio: 5.9.0
  retrofit: 4.9.0
  pretty_dio_logger: 1.4.0
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0
  flutter_secure_storage: 9.2.4
  shared_preferences: 2.5.3
  crypto: ^3.0.6
  flutter_screenutil: ^5.9.3
  pinput: ^6.0.1
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0
  intl: ^0.20.2
  safe_device: ^1.1.6
  lottie: ^3.3.2
  uuid: ^4.5.3
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1
  synchronized: ^3.4.0
  flutter_native_splash: ^2.4.3
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  geolocator: ^14.0.2
  image_picker: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5
  # Activity attachments: §Workflow 1 accepts photos, voice notes and
  # PDF/Word, so capture needs more than image_picker alone.
  record: ^6.2.1           # microphone capture (voice notes)
  just_audio: ^0.9.42     # playback with a scrub bar
  file_picker: ^8.1.7     # choosing PDFs / documents
  open_filex: ^4.7.0      # handing a downloaded file to the OS viewer
  # Already present transitively (via hive_flutter/record), declared
  # explicitly because this app imports it directly for the voice-note
  # temp path — relying on a transitive dep would break on any upstream
  # bump that drops it.
  path_provider: ^2.1.5
  # Disk-backed image cache. Flutter's built-in ImageCache holds *decoded*
  # images in memory only, so anything evicted when scrolling is fetched over
  # the network again — which is exactly what a rep on mobile data notices.
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1  # brand logo lockup
  shimmer: ^3.0.0
  google_maps_flutter: ^2.9.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: 2.10.3
  freezed: 3.2.3
  json_serializable: ^6.11.1
  retrofit_generator: 10.1.4
  flutter_launcher_icons: ^0.14.4
  bloc_test: ^10.0.0
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# Launcher icon — generated by `dart run flutter_launcher_icons`.
#
# ⚠️ Do not point these back at `assets/images/icon.png`. That file is
# 896x1200 — not square — with ~370px of dead white above the mark and ~410px
# below it. flutter_launcher_icons resizes its input straight to a square, so
# using it produced a horizontally-squashed wordmark sitting off-centre.
#
# The two files below are derived from it (content cropped to its bounding
# box, then centred on a square canvas without distortion):
#
#   icon_square.png     1024x1024, opaque white, no alpha channel — the App
#                       Store rejects icons that carry one.
#   icon_foreground.png 1024x1024, transparent, mark held inside the central
#                       62% so Android's circular and squircle masks cannot
#                       clip the outer letters. The previous config passed the
#                       full-bleed icon as the foreground with only a 16%
#                       inset, which cropped "NEW POWER" to "EW POWE" on a
#                       Pixel.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/icon_square.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"

# Native splash screen — generated by `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_screen.png
  android_12:
    color: "#FFFFFF"
    image: assets/images/splach_screen_12.png
