# Sized for this machine: 8 GB of physical RAM, no more.
#
# This was -Xmx8G with -XX:MaxMetaspaceSize=4G, which asks a single daemon for
# ~12 GB on an 8 GB box. It appeared to work while the machine was otherwise
# idle, then failed hard once a few daemons accumulated:
#
#   There is insufficient memory for the Java Runtime Environment to continue.
#   Native memory allocation (malloc) failed to allocate 32784 bytes
#
# — a JVM crash, which Gradle surfaces as the much less helpful "Gradle build
# daemon disappeared unexpectedly". Nothing about the build was wrong.
#
# 2 GB of heap is comfortable for an app of this size; AGP's own default is
# 1 GB. If a genuine OutOfMemoryError ever appears (not a daemon disappearing,
# which is the *opposite* symptom) raise this in 512 MB steps rather than
# returning to a figure the machine cannot honour.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# The Kotlin compile daemon is a *second* JVM, and it does not inherit the
# line above. Left unbounded it defaults to a large heap and competes with
# Gradle's own daemon for the same 8 GB.
kotlin.daemon.jvmargs=-Xmx1G

# Stale daemons were a direct contributor to the crash above: eight were alive
# ("5 busy and 3 stopped Daemons could not be reused") each holding its
# reservation. Retire them after 30 minutes instead of the 3-hour default.
org.gradle.daemon.idletimeout=1800000

android.useAndroidX=true

# Google's Maven repo (dl.google.com) has been timing out / resetting mid-download
# on this network for multiple unrelated artifacts (AGP, material-1.9.0.aar, ...).
# Give Gradle more time and more attempts before giving up, instead of failing
# the whole build on the first transient network hiccup.
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=500

# Kotlin's incremental compiler computes a relative path between the pub
# cache (this project's plugin sources live under C:\Users\...\Pub\Cache)
# and the build directory (this project is checked out on I:). Windows has
# no relative path between two different drive letters, so
# RelocatableFileToPathConverter.toPath throws "this and base files have
# different roots" — which crashes the compile daemon mid-build rather
# than failing cleanly (KT-... class of bug, still open on Windows).
# Disabling incremental compilation avoids the code path entirely; the
# cost is a slightly slower `kotlinc` step, not a correctness change.
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.useClasspathSnapshot=false
